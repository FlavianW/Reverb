name: Mobile Release

# Un tag `vX.Y.Z` poussé sur le dépôt crée la release GitHub et y attache les
# builds, dans le même run : on évite ainsi de dépendre d'un release GitHub
# créé manuellement au préalable (jamais fait jusqu'ici, d'où l'absence
# d'APK) et du piège du GITHUB_TOKEN par défaut, qui ne redéclenche pas
# `on: release` sur les autres workflows du dépôt.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  android:
    name: APK Android (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis le tag
        id: version
        # `refs/tags/v1.2.3` -> `1.2.3`, utilisé comme build-name Flutter ;
        # le numéro de run GitHub sert de build-number, toujours croissant.
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Récupération des dépendances
        working-directory: apps/mobile
        run: flutter pub get

      # La clé de signature de release (indispensable à Google Sign-In, voir
      # apps/mobile/android/app/build.gradle.kts) arrive par secret GitHub,
      # encodée en base64. Sans le secret, le build retombe sur la clé de
      # debug du runner : l'APK reste installable, seule la connexion Google
      # y est inopérante. GitHub stocke les secrets tels quels, blancs de
      # copier-coller compris : les valeurs sont nettoyées (retours à la
      # ligne, retours chariot) puis le mot de passe est vérifié contre le
      # keystore par keytool AVANT le build - un secret mal collé échoue en
      # quelques secondes avec un message clair, pas au bout de cinq minutes
      # au moment de la signature.
      - name: Préparer et vérifier la clé de signature release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/reverb-release.jks"
            CLEAN_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
            if ! keytool -list -keystore "$RUNNER_TEMP/reverb-release.jks" \
                -alias reverb -storepass "$CLEAN_PASSWORD" > /dev/null 2>&1; then
              echo "::error::Le secret ANDROID_KEYSTORE_PASSWORD ne déverrouille pas le keystore (ou l'alias 'reverb' est absent). Vérifier les deux secrets."
              exit 1
            fi
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/reverb-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$CLEAN_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build APK release
        working-directory: apps/mobile
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: App iOS (non signée, best-effort)
    runs-on: macos-latest
    # Sans compte développeur Apple, aucun certificat de signature n'est
    # disponible : le build produit une .app non signée, installable
    # uniquement sur simulateur. On tente quand même, sans bloquer la
    # release Android si cette étape échoue.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis le tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable

      - name: Récupération des dépendances
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build iOS sans signature
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Compresser l'app iOS
        working-directory: apps/mobile/build/ios/iphoneos
        run: zip -r Runner.app.zip Runner.app

      - name: Publier l'app iOS sur la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/mobile/build/ios/iphoneos/Runner.app.zip
