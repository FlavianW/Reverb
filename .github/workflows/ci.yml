name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  api:
    name: API (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        # Sans --fix (contrairement au script local) : en CI, une violation doit
        # faire échouer le job plutôt que d'être corrigée silencieusement dans
        # le runner éphémère sans jamais être commitée.
        run: pnpm --filter api exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Tests unitaires
        run: pnpm --filter api test

      - name: Build
        run: pnpm --filter api build

  web:
    name: Web (check, lint, tests, build)
    runs-on: ubuntu-latest
    env:
      # Valeur factice : aucune étape n'effectue d'appel réseau, mais
      # $env/static/public (résolu dès `svelte-kit sync`, pas seulement au
      # build) a besoin que PUBLIC_API_URL existe. En local, ça vient de
      # apps/web/.env, absent ici puisque gitignoré.
      PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vérification des types (svelte-check)
        run: pnpm --filter web check

      - name: Lint
        run: pnpm --filter web lint

      - name: Tests unitaires
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

  mobile:
    name: Mobile (analyse, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Récupération des dépendances
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyse statique
        # --no-fatal-infos : les infos de style (ex. lints de dépréciation Flutter
        # récents) ne doivent pas faire échouer la CI, seules les erreurs/warnings comptent.
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires et widgets
        working-directory: apps/mobile
        run: flutter test

      - name: Build (APK debug)
        working-directory: apps/mobile
        run: flutter build apk --debug
