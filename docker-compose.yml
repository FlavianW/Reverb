# Services pour le développement local de apps/api uniquement.
# N'interviennent pas dans l'image de production (voir apps/api/Dockerfile).
# En prod, Postgres est RDS et le stockage média est S3 + CloudFront (voir CLAUDE.md) :
# MinIO ci-dessous ne sert qu'à émuler l'API S3 en local, sans compte AWS.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reverb
      POSTGRES_PASSWORD: reverb
      POSTGRES_DB: reverb
    # Port hôte 5433 (et non 5432) pour ne pas entrer en conflit avec une
    # éventuelle instance PostgreSQL déjà installée nativement sur la machine.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reverb
      MINIO_ROOT_PASSWORD: reverb-minio
    ports:
      - "9000:9000" # API compatible S3
      - "9001:9001" # console web
    volumes:
      - minio_data:/data

  # Crée le bucket "reverb-media" au démarrage puis s'arrête (pas de service persistant).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 reverb reverb-minio) do sleep 1; done;
      mc mb --ignore-existing local/reverb-media;
      mc anonymous set download local/reverb-media;
      "

volumes:
  postgres_data:
  minio_data:
