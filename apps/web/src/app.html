<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover : nécessaire pour que env(safe-area-inset-bottom)
		     soit non nul sur iPhone, la barre de navigation basse s'appuie dessus. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			// Applique le thème avant le premier rendu : sans ce script synchrone,
			// un thème différent de celui du CSS initial provoquerait un flash le
			// temps que le JS de l'app s'exécute. Le sombre est le thème par
			// défaut de Reverb (identité "salle de concert") ; le clair est un
			// choix explicite de l'utilisateur.
			(function () {
				try {
					var stored = localStorage.getItem('reverb-theme');
					document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
				} catch (e) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
